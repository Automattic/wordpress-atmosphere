name: Unit Tests

on:
  push:
    branches:
      - trunk
    paths:
      - '**.php'
      - composer.json
      - composer.lock
      - .github/workflows/phpunit.yml
  pull_request:
    paths:
      - '**.php'
      - composer.json
      - composer.lock
      - .github/workflows/phpunit.yml

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=10s --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.5']
        wp-version: ['latest']
        include:
          - php-versions: '8.2'
            wp-version: '6.2'
          - php-versions: '8.5'
            wp-version: 'trunk'
    steps:
      - name: Install svn
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer
          extensions: mysql

      - name: Install Composer dependencies
        uses: ramsey/composer-install@5c2bcf28d7b060ef3c601d7b476d5430a7b46c27 # v4

      - name: Setup Test Environment
        run: bash ./bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp-version }}

      - name: Unit Testing
        run: ./vendor/bin/phpunit
        env:
          PHP_VERSION: ${{ matrix.php-versions }}
