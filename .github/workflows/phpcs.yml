name: PHP_CodeSniffer

on:
  push:
    branches:
      - trunk
    paths:
      - '**.php'
      - phpcs.xml
      - composer.json
      - composer.lock
      - .github/workflows/phpcs.yml
  pull_request:
    paths:
      - '**.php'
      - phpcs.xml
      - composer.json
      - composer.lock
      - .github/workflows/phpcs.yml

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Detect coding standard violations
        run: ./vendor/bin/phpcs
